name: Build Xiaozhi Humanoid Robot
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ESP32-S3 Firmware
        run: |
          . $IDF_PATH/export.sh
          python3 scripts/build.py bread-compact-wifi --name bread-compact-wifi-128x64
      - name: Publish Firmware File to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-robot
          name: Xiaozhi Humanoid Robot Firmware (1.3-inch SH1106 + 9-Servo)
          files: build/merged-binary.bin
