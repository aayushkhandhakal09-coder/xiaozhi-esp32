name: Build Xiaozhi Humanoid Robot
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ESP32-S3 Firmware
        run: |
          . $IDF_PATH/export.sh
          python3 scripts/release.py bread-compact-wifi
      - name: Upload Robot Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-humanoid-robot-firmware
          path: releases/*.zip
